# AIKOs settings. Change values here, never in the code.
assistant:
  name: Aiko               # said like the Japanese name "Aiko"
  name_th: ไอโกะ
  self_pronoun_th: ฉัน      # how she refers to herself in Thai
  languages: [th, en]
  memory_turns: 10         # how many recent exchanges AIKOs remembers

profile: minimum           # minimum (4 GB RAM), standard (8 GB) or high (16 GB+ / GPU)

llm:
  provider: ollama
  host: http://127.0.0.1:11434
  model: qwen3:1.7b
  fast_model: qwen3:1.7b
  embed_model: nomic-embed-text
  no_think: true           # faster answers from Qwen3 on low-spec PCs

speech:                    # used from Phase 2
  stt_model: base          # faster-whisper: base (faster) or small (better Thai)
  push_to_talk_key: ctrl+alt+space
  wake_words: [ไอโกะ, Aiko, สวัสดี ไอโกะ]   # Phase 3: hearing any of these wakes her up
  tts_english: piper
  tts_english_voice: en_US-amy-medium      # female voice
  tts_thai: edge-tts
  tts_thai_voice: th-TH-PremwadeeNeural    # female voice

cloud:                     # Phase 6
  enabled: false
  provider: anthropic
  model: claude-opus-5-5
  monthly_budget_usd: 10

safety:
  confirm_before_changes: true
  email_mode: draft_only

paths:
  data_dir: data           # notes, reminders, memory, logs (not in Git)
